<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a YouConnext</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f7fa;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0">
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            "
          >
            <tr>
              <td
                style="
                  background-color: #2563eb;
                  padding: 30px 40px;
                  text-align: center;
                "
              >
                <h1 style="color: #ffffff; margin: 0; font-size: 24px">
                  YouConnext
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px">
                <h2 style="color: #1e293b; margin: 0 0 20px">
                  ¡Bienvenido, {{name}}! 🎉
                </h2>
                <p style="color: #475569; font-size: 16px; line-height: 1.6">
                  Gracias por unirte a YouConnext. Tu cuenta ha sido creada
                  correctamente y ya puedes empezar a compartir viajes con otras
                  personas.
                </p>
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin: 30px 0"
                >
                  <tr>
                    <td align="center">
                      <a
                        href="{{frontendUrl}}/login"
                        style="
                          background-color: #2563eb;
                          color: #ffffff;
                          text-decoration: none;
                          padding: 14px 32px;
                          border-radius: 8px;
                          font-size: 16px;
                          display: inline-block;
                          font-weight: bold;
                        "
                        >Empezar a viajar</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="color: #94a3b8; font-size: 14px; margin-top: 30px">
                  Si no creaste esta cuenta, puedes ignorar este correo.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  background-color: #f8fafc;
                  padding: 20px 40px;
                  text-align: center;
                "
              >
                <p style="color: #94a3b8; font-size: 13px; margin: 0">
                  © 2025 YouConnext. Todos los derechos reservados.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
