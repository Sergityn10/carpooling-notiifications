services:
  mysql:
    image: mysql:8.4
    container_name: carpooling-notifications-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: carpooling_notifications
      MYSQL_USER: carpooling_notifications_user
      MYSQL_PASSWORD: carpooling_notifications_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: carpooling-notifications-app
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://carpooling_notifications_user:carpooling_notifications_password@mysql:3306/carpooling_notifications
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
